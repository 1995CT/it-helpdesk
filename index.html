<body>
  <!-- Biometric Auth via WebAuthn -->
  <script>
    const BIO_USERNAME_KEY = 'bio_username';
    const BIO_CREDENTIAL_KEY = 'bio_credential_id';

    function isBiometricAvailable() {
      return !!(window.PublicKeyCredential && navigator.credentials);
    }

    async function registerBiometric(username) {
      try {
        const challenge = new Uint8Array(32);
        crypto.getRandomValues(challenge);
        const userId = new TextEncoder().encode(username);
        const credential = await navigator.credentials.create({
          publicKey: {
            challenge,
            rp: { name: "IT Helpdesk", id: location.hostname },
            user: { id: userId, name: username, displayName: username },
            pubKeyCredParams: [{ alg: -7, type: "public-key" }],
            authenticatorSelection: { userVerification: "preferred" },
            timeout: 60000,
          }
        });
        if (credential) {
          localStorage.setItem(BIO_USERNAME_KEY, username);
          localStorage.setItem(BIO_CREDENTIAL_KEY, btoa(String.fromCharCode(...new Uint8Array(credential.rawId))));
          return true;
        }
        return false;
      } catch (e) {
        console.log('Biometric register error:', e);
        return false;
      }
    }

    async function verifyBiometric() {
      try {
        const credIdB64 = localStorage.getItem(BIO_CREDENTIAL_KEY);
        if (!credIdB64) return false;
        const credId = Uint8Array.from(atob(credIdB64), c => c.charCodeAt(0));
        const challenge = new Uint8Array(32);
        crypto.getRandomValues(challenge);
        const assertion = await navigator.credentials.get({
          publicKey: {
            challenge,
            allowCredentials: [{ id: credId, type: "public-key" }],
            userVerification: "preferred",
            timeout: 60000,
          }
        });
        return !!assertion;
      } catch (e) {
        console.log('Biometric verify error:', e);
        return false;
      }
    }

    function getBioUsername() {
      return localStorage.getItem(BIO_USERNAME_KEY) || '';
    }

    function clearBiometric() {
      localStorage.removeItem(BIO_USERNAME_KEY);
      localStorage.removeItem(BIO_CREDENTIAL_KEY);
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
